

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvida"
version = "0.1.0"
description = "OpenVIDA web application"
requires-python = ">=3.10"
dependencies = [
    "click==8.1.8",
    "Flask==3.1.1",
    "Werkzeug==3.1.3",
    "SQLAlchemy==2.0.41",
    "Flask-SQLAlchemy==3.1.1",
    "pyodbc==5.2.0",
    "gevent==25.5.1",
    "gunicorn==23.0.0",
    "supervisor==4.2.5",
    "Flask-Caching==2.3.1",
    "Flask-DebugToolbar==0.16.0",
    "environs==14.2.0",
    "python-cgm==0.3.*",
    "vida-py==1.0.*",
    "lxml==5.4.0",
    "setuptools<82.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black==26.5.*",
    "codespell==2.4.*",
    "isort==8.0.*",
    "mypy==2.3.*",
    "pylint==4.0.*",
    "ruff==0.15.*",
]
prod = []

[tool.setuptools.packages.find]
include = ["openvida", "openvida.*"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "I",   # isort
    "N",   # pep8-naming
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
]
ignore = [
    "B026", # star-arg-unpacking-after-keyword-arg
    "PLR",  # pylint refactor
]

[tool.black]
line-length = 100
include = '(openvida | .github).*\.pyi?$'

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 90
known_first_part = 'openvida'

[tool.codespell]
skip = '.git,setup.cfg'
ignore-words = '.codespell_ignore_words'
quiet-level = 3

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint]
extension-pkg-allow-list = ["lxml", "sqlalchemy.func"]
