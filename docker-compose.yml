x-build-args: &build_args
    INSTALL_PYTHON_VERSION: "3.13.3"

x-db-paths: &db_paths
    VIDA_ACCESS_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/AccessServer?driver=ODBC+Driver+17+for+SQL+Server
    VIDA_BASEDATA_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/basedata?driver=ODBC+Driver+17+for+SQL+Server
    VIDA_CARCOM_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/carcom?driver=ODBC+Driver+17+for+SQL+Server
    VIDA_DIAG_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/DiagSwdlRepository?driver=ODBC+Driver+17+for+SQL+Server
    VIDA_SESSION_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/DiagSwdlSession?driver=ODBC+Driver+17+for+SQL+Server
    VIDA_TIMING_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/DiceTiming?driver=ODBC+Driver+17+for+SQL+Server
    VIDA_EPC_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/epc?driver=ODBC+Driver+17+for+SQL+Server
    VIDA_IMAGES_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/ImageRepository?driver=ODBC+Driver+17+for+SQL+Server
    VIDA_SERVICE_DB_URI: mssql+pyodbc://sa:VidaFlask.123@vida-db/servicerep_en-US?driver=ODBC+Driver+17+for+SQL+Server

services:
    vida-db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: vida-db
        restart: always
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "VidaFlask.123"
        ports:
            - 1433:1433
        volumes:
            - sqlserverdata:/var/opt/mssql
            - ${VIDA_DB_HOST_PATH}:/vida

    dbgate:
        image: dbgate/dbgate
        restart: always
        depends_on:
            - vida-db
        ports:
            - 3005:3000
        volumes:
            - dbgate-data:/root/.dbgate

        environment:
            CONNECTIONS: vida
            LABEL_vida: VIDA SQL Server
            SERVER_vida: vida-db
            USER_vida: sa
            PASSWORD_vida: VidaFlask.123
            PORT_vida: 1433
            ENGINE_vida: mssql@dbgate-plugin-mssql

    flask-dev:
        build:
            context: .
            target: development
            args:
                <<: *build_args
        image: openvida-development
        ports:
            - 5000:5000
        environment:
            FLASK_ENV: development
            FLASK_DEBUG: 1
            LOG_LEVEL: debug
            GUNICORN_WORKERS: 4
            <<: *db_paths
        depends_on:
            - vida-db
        volumes:
            - ${VIDA_XSL_HOST_PATH}:${VIDA_XSL_PATH}
            - ./:/app

    flask-prod:
        build:
            context: .
            target: production
            args:
                <<: *build_args
        image: openvida-production
        restart: always
        ports:
            - 127.0.0.1:5000:5000
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            FLASK_ENV: production
            FLASK_DEBUG: 0
            LOG_LEVEL: info
            GUNICORN_WORKERS: 4
            <<: *db_paths
        depends_on:
            - vida-db
        volumes:
            - ${VIDA_XSL_HOST_PATH}:${VIDA_XSL_PATH}

    manage:
        build:
            context: .
            target: development
            args:
                <<: *build_args
        entrypoint: flask
        environment:
            FLASK_ENV: production
            FLASK_DEBUG: 0
        image: openvida-manage
        stdin_open: true
        tty: true
        volumes:
            - ${VIDA_XSL_HOST_PATH}:${VIDA_XSL_PATH}

volumes:
    sqlserverdata:
    dbgate-data:
        driver: local
